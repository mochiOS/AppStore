[package]
name = "mochios-mpkg-reviewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
mochios-certificate = { git = "https://github.com/mochiOS/syscalls", rev = "ee6be939de4635824df7f50858d66391dd6ead41" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
rand = "0.8"
