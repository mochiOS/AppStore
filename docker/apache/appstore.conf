ServerName store.mochios.org

<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</IfModule>

<VirtualHost *:80>
    ServerName store.mochios.org

    DocumentRoot /var/www/html/src/public
    DirectoryIndex index.php index.html

    <Directory /var/www/html/src/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName console.mochios.org

    DocumentRoot /var/www/html/src/public/console
    DirectoryIndex index.php index.html

    <Directory /var/www/html/src/public/console>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName api.mochios.org

    DocumentRoot /var/www/html/src/api
    DirectoryIndex index.html router.php

    <Directory /var/www/html/src/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ router.php [QSA,L]
    </Directory>
</VirtualHost>
