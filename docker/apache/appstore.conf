ServerName store.mochios.org

<VirtualHost *:80>
    ServerName store.mochios.org

    DocumentRoot /var/www/html/src/public
    DirectoryIndex index.php index.html

    <Directory /var/www/html/src/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName console.mochios.org

    DocumentRoot /var/www/html/src/public/console
    DirectoryIndex index.php index.html

    <Directory /var/www/html/src/public/console>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName api.mochios.org

    DocumentRoot /var/www/html/src/api
    DirectoryIndex index.html router.php

    Header always set Access-Control-Allow-Origin "https://console.mochios.org"
    Header always set Access-Control-Allow-Credentials "true"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"

    <Directory /var/www/html/src/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ router.php [QSA,L]
    </Directory>
</VirtualHost>