openapi: 3.1.0
info:
  title: mochiOS AppStore API
  version: 1.0.0
  description: |
    アプリ登録、Package upload、Release審査、公開カタログを扱うAPIです。
    OAuth、Developer管理、Developer審査、Certificate発行・失効APIは
    AccountsおよびDeveloperCAへ移管済みです。
servers:
  - url: /v1
tags:
  - name: 公開カタログ
  - name: 暫定セッション
  - name: 公開鍵（暫定）
  - name: Bundle ID
  - name: Developer Apps
  - name: Developer Releases
  - name: Teams
  - name: Release管理
paths:
  /auth/csrf:
    get:
      tags: [暫定セッション]
      summary: AppStore管理画面用のCSRF tokenを取得する
      responses:
        "200": { description: CSRF token }
  /auth/me:
    get:
      tags: [暫定セッション]
      summary: 暫定AppStore sessionのDeveloper IDを取得する
      responses:
        "200": { description: Developer IDとCSRF token }
        "401": { description: 暫定sessionが存在しない }
  /auth/logout:
    post:
      tags: [暫定セッション]
      summary: 暫定AppStore sessionを終了する
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "200": { description: ログアウト完了 }
  /apps:
    get:
      tags: [公開カタログ]
      summary: 公開アプリ一覧を取得する
      responses:
        "200": { description: アプリ一覧 }
  /apps/{bundle_id}:
    get:
      tags: [公開カタログ]
      summary: 公開アプリ詳細を取得する
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200": { description: アプリ詳細 }
        "404": { description: アプリが存在しない }
  /apps/{bundle_id}/releases:
    get:
      tags: [公開カタログ]
      summary: 公開Release一覧を取得する
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200": { description: Release一覧 }
  /apps/{bundle_id}/releases/{version}:
    get:
      tags: [公開カタログ]
      summary: Release詳細を取得する
      parameters:
        - $ref: "#/components/parameters/BundleId"
        - name: version
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Release詳細 }
        "404": { description: Releaseが存在しない }
  /apps/{bundle_id}/download:
    get:
      tags: [公開カタログ]
      summary: 公開Packageをダウンロードする
      parameters:
        - $ref: "#/components/parameters/BundleId"
        - name: version
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { description: Package本体 }
        "404": { description: Packageが存在しない }
  /search:
    get:
      tags: [公開カタログ]
      summary: 公開アプリを検索する
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: 検索結果 }
  /keys:
    get:
      tags: [公開鍵（暫定）]
      summary: 現在のDeveloperの公開鍵を取得する
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: 公開鍵一覧 }
    post:
      tags: [公開鍵（暫定）]
      summary: Package署名検証用の公開鍵を登録する
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "201": { description: 登録済み公開鍵 }
  /keys/{public_key}:
    get:
      tags: [公開鍵（暫定）]
      summary: Package署名検証用の公開鍵情報を取得する
      parameters:
        - name: public_key
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "200": { description: 公開鍵情報 }
        "404": { description: 公開鍵が存在しない }
  /keys/{key_id}/revoke:
    post:
      tags: [公開鍵（暫定）]
      summary: 公開鍵を失効させる
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 失効済み公開鍵 }
  /bundle-ids:
    get:
      tags: [Bundle ID]
      summary: 所有Bundle ID一覧を取得する
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Bundle ID一覧 }
    post:
      tags: [Bundle ID]
      summary: Bundle IDを予約する
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "201": { description: 予約済みBundle ID }
  /developer/apps:
    get:
      tags: [Developer Apps]
      summary: 所有アプリ一覧を取得する
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: アプリ一覧 }
    post:
      tags: [Developer Apps]
      summary: アプリを登録する
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "201": { description: 登録済みアプリ }
  /developer/apps/{bundle_id}:
    get:
      tags: [Developer Apps]
      summary: 所有アプリ詳細を取得する
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200": { description: アプリ詳細 }
        "404": { description: アプリが存在しない }
  /developer/apps/{bundle_id}/team:
    post:
      tags: [Developer Apps]
      summary: アプリを所有するAppStore内チームを設定する
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200": { description: 更新済みアプリ }
  /developer/apps/{bundle_id}/releases:
    get:
      tags: [Developer Releases]
      summary: 所有アプリのRelease一覧を取得する
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200": { description: Release一覧 }
    post:
      tags: [Developer Releases]
      summary: `.pkg`をuploadしてdraft Releaseを作成する
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "201": { description: 作成済みRelease }
  /developer/releases/{release_id}/submit:
    post:
      tags: [Developer Releases]
      summary: Releaseを審査へ提出する
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200": { description: 提出済みRelease }
  /developer/releases/{release_id}:
    get:
      tags: [Developer Releases]
      summary: 所有Releaseの詳細を取得する
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200": { description: Release詳細 }
        "404": { description: Releaseが存在しない }
  /teams:
    get:
      tags: [Teams]
      summary: AppStore内チーム一覧を取得する
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: チーム一覧 }
    post:
      tags: [Teams]
      summary: AppStore内チームを作成する
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        "201": { description: 作成済みチーム }
  /teams/{team_id}:
    get:
      tags: [Teams]
      summary: AppStore内チームの詳細を取得する
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200": { description: チーム詳細 }
        "404": { description: チームが存在しない }
  /teams/{team_id}/members:
    get:
      tags: [Teams]
      summary: AppStore内チームのメンバー一覧を取得する
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200": { description: メンバー一覧 }
    post:
      tags: [Teams]
      summary: AppStore内チームへメンバーを追加する
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "201": { description: 追加済みメンバー }
  /teams/{team_id}/members/{developer_id}/role:
    post:
      tags: [Teams]
      summary: AppStore内チームのメンバー権限を変更する
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/DeveloperId"
      responses:
        "200": { description: 更新済みメンバー }
  /teams/{team_id}/members/{developer_id}/remove:
    post:
      tags: [Teams]
      summary: AppStore内チームからメンバーを削除する
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/DeveloperId"
      responses:
        "200": { description: 削除完了 }
  /admin/releases:
    get:
      tags: [Release管理]
      summary: 審査対象Release一覧を取得する
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Release一覧 }
  /admin/releases/{release_id}/approve:
    post:
      tags: [Release管理]
      summary: Releaseを承認して公開する
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200": { description: 公開済みRelease }
  /admin/releases/{release_id}/reject:
    post:
      tags: [Release管理]
      summary: Releaseを却下する
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200": { description: 却下済みRelease }
  /admin/releases/{release_id}/download:
    get:
      tags: [Release管理]
      summary: 審査用Packageをダウンロードする
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ReleaseId"
      responses:
        "200": { description: Package本体 }
        "404": { description: Packageが存在しない }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mochios_appstore_session
      description: Accounts統合までの暫定AppStore session。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 状態変更リクエストに必要な暫定CSRF token。
  parameters:
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9.-]+\\.[a-z0-9.-]+$"
    ReleaseId:
      name: release_id
      in: path
      required: true
      schema: { type: string }
    TeamId:
      name: team_id
      in: path
      required: true
      schema: { type: string }
    DeveloperId:
      name: developer_id
      in: path
      required: true
      schema: { type: string, format: uuid }
