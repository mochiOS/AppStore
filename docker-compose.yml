services:
  appstore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mochi-appstore
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - /srv/appstore/data:/var/www/html/data
    environment:
      APP_ENV: production

  appstore-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mochi-appstore-api
    restart: unless-stopped
    working_dir: /var/www/html/src/api
    command: php -S 0.0.0.0:80 router.php
    ports:
      - "127.0.0.1:3002:80"
    volumes:
      - /srv/appstore/data:/var/www/html/data
    environment:
      APP_ENV: production

volumes:
  appstore_data:
