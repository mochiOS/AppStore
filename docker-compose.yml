services:
  appstore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mochi-appstore
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - /srv/appstore/data:/var/www/html/data
    environment:
      APP_ENV: production
volumes:
  appstore_data:
