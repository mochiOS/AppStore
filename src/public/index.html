<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>mochiOS Developer Console</title>
    <script src="/common.js"></script>
</head>
<body>
    <h1>mochiOS Developer Console</h1>

    <div>
        <button class="isNotLogin" id="loginButton" type="button">
            Login with GitHub
        </button>
        <button class="isLogin" id="logoutButton" type="button">
            Logout
        </button>
    </div>

    <div>
        <p>認証状態: <span id="loginState">確認中</span></p>
        <p>Developer ID: <span id="developerId">-</span></p>
    </div>

    <hr>

    <section>
        <h2>Profile</h2>
        <button id="showMeButton" type="button">GET /v1/auth/me</button>
        <button id="showDeveloperButton" type="button">GET /v1/developers/me</button>
    </section>

    <section class="isLogin">
        <h2>Public Keys</h2>
        <div>
            <label for="publicKeyInput"></label><textarea id="publicKeyInput" rows="6" cols="80">ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestKey mochios@example</textarea>
        </div>
        <div>
            <button id="createKeyButton" type="button">POST /v1/keys</button>
            <button id="listKeysButton" type="button">GET /v1/keys</button>
        </div>
        <div>
            <label for="revokeKeyIdInput"></label><input id="revokeKeyIdInput" type="text" placeholder="key_id">
            <button id="revokeKeyButton" type="button">POST /v1/keys/{key_id}/revoke</button>
        </div>
    </section>

    <section class="isLogin">
        <h2>Bundle IDs</h2>
        <div>
            <label for="bundleIdInput"></label><input id="bundleIdInput" type="text" value="org.mochios.example">
            <label for="appNameInput"></label><input id="appNameInput" type="text" value="Example App">
        </div>
        <div>
            <button id="createBundleIdButton" type="button">POST /v1/bundle-ids</button>
            <button id="listBundleIdsButton" type="button">GET /v1/bundle-ids</button>
        </div>
    </section>

    <hr>

    <section>
        <h2>Response</h2>
        <pre id="output"></pre>
    </section>

    <script>
        const output = document.getElementById("output");
        const loginState = document.getElementById("loginState");
        const developerId = document.getElementById("developerId");

        function renderJson(value) {
            output.textContent = JSON.stringify(value, null, 2);
        }

        async function refreshAuthSummary() {
            const auth = await showMe();
            const currentDeveloperId = auth && auth.developer_id
                ? auth.developer_id
                : "-";

            loginState.textContent = auth ? "logged in" : "not logged in";
            developerId.textContent = currentDeveloperId;

            return auth;
        }

        async function handleRequest(callback) {
            try {
                const result = await callback();
                renderJson(result);
            } catch (error) {
                renderJson({
                    error: error.message
                });
            }
        }

        async function init() {
            document.getElementById("loginButton").addEventListener("click", () => {
                login("github");
            });

            document.getElementById("logoutButton").addEventListener("click", () => {
                logout();
            });

            document.getElementById("showMeButton").addEventListener("click", async () => {
                await handleRequest(showMe);
                await refreshAuthSummary();
                await updateLoginState();
            });

            document.getElementById("showDeveloperButton").addEventListener("click", async () => {
                await handleRequest(showDeveloper);
                await refreshAuthSummary();
                await updateLoginState();
            });

            document.getElementById("createKeyButton").addEventListener("click", async () => {
                const publicKey = document.getElementById("publicKeyInput").value;
                await handleRequest(() => createKey(publicKey));
            });

            document.getElementById("listKeysButton").addEventListener("click", async () => {
                await handleRequest(listKeys);
            });

            document.getElementById("revokeKeyButton").addEventListener("click", async () => {
                const keyId = document.getElementById("revokeKeyIdInput").value.trim();
                await handleRequest(() => revokeKey(keyId));
            });

            document.getElementById("createBundleIdButton").addEventListener("click", async () => {
                const bundleId = document.getElementById("bundleIdInput").value.trim();
                const appName = document.getElementById("appNameInput").value.trim();
                await handleRequest(() => createBundleId(bundleId, appName));
            });

            document.getElementById("listBundleIdsButton").addEventListener("click", async () => {
                await handleRequest(listBundleIds);
            });

            await refreshAuthSummary();
            await updateLoginState();
        }

        init();
    </script>
</body>
</html>
